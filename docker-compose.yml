services:
  # ─── Nginx Reverse Proxy ─────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: todo-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - todo-net

  # ─── Laravel API Backend ────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todo-api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      APP_URL: http://localhost:8080
      ASSET_URL: http://localhost:8080
      FRONTEND_URL: http://localhost:8080
      SANCTUM_STATEFUL_DOMAINS: localhost,localhost:8080
    volumes:
      - api-database:/var/www/database
    healthcheck:
      test: ["CMD", "php", "artisan", "about", "--only=Environment"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - todo-net

  # ─── Nuxt 4 Frontend ────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: todo-frontend
    ports:
      - "3000:3000"
    environment:
      NUXT_API_BASE_URL: http://api:8000/api
      NUXT_PUBLIC_API_BASE_URL: /api
    depends_on:
      api:
        condition: service_healthy
    networks:
      - todo-net

networks:
  todo-net:
    driver: bridge

volumes:
  api-database:
